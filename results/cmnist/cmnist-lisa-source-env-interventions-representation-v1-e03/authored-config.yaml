# Trimmed record: representation-consistency and two-layer-control entries
# (not reported in the paper) are removed; see results/TRIMMING.json.
# Held-out validation e03: LISA with the training sources as its domains,
# crossed with vanilla, GRIT, prediction and representation consistency.
# Same grids and seeds as the label x attribute row; see the protocol's
# source-environment rows.
schema_version: grit.production-search/v1
dataset: cmnist
protocol_id: cmnist/v1
experiment_name: cmnist-lisa-source-env-interventions-representation-v1-e03
experiment_variant: primary_unnormalized
normalization: none
artifacts:
  dataset_manifest: ${PROJECT_SCRATCH}/artifacts/cmnist-none-e03/dataset-manifest.json
  feature_cache_manifest: ${PROJECT_SCRATCH}/artifacts/cmnist-none-e03/feature-cache/manifest.json
  oracle_pair_manifest: ${PROJECT_SCRATCH}/artifacts/cmnist-none-e03/pair-manifest.json
seeds:
  construction: 1729
  pairs: 2718
  stages:
    tuning: [1101, 1102, 1103]
    confirmation: [2101, 2102]
    final: [3101, 3102, 3103, 3104, 3105, 3106, 3107, 3108, 3109, 3110]
search_space:
  methods: [lisa, lisa_grit, lisa_consistency]
  learning_rates: [1e-4, 3e-4, 1e-3, 3e-3]
  weight_decays: [0.0, 1e-5, 1e-4, 1e-3]
  projection_ranks: [2, 8, 16, 24]
  consistency_weights: [0.01, 0.1, 1.0, 10.0]
  lisa_selection_probs: [0.0, 0.1, 0.3, 0.5, 0.7, 0.9, 1.0]
  lisa_group_definition: target_environment  # label x training source
selectors: [primary_robust, secondary_source]
pair_count: 256
batch_size: 256
max_epochs: 40
output_root: ${PROJECT_SCRATCH}/outputs/cmnist-lisa-source-env-interventions-representation-v1-e03
runtime:
  device: cpu
  deterministic_algorithms: true
  workers: 1
relative_singular_value_tolerance: 1e-12
